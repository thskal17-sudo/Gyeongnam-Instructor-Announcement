name: report
on:
  # 예약 수집이 끝나면 곧바로 보낸다. 따로 예약하면 수집과 리포트가 각각 몇 시간씩 밀린다
  # (06:05 예약이 09:57 에 돌았다, 2026-09-29)
  workflow_run:
    workflows: [collect]
    # 수집이 일부 실패해도 돈다 — 실패 소스는 리포트 부록에 적힌다. 다만 오늘 첫 수집에서 여러 곳이
    # 한꺼번에 새로 실패했으면 두 번째 수집 뒤로 미룬다(--hold-if-degraded)
    types: [completed]
  schedule:
    # 예비: 그날 수집 예약이 한 번도 안 돌았거나, 첫 수집 뒤 미룬 발송을 두 번째 수집이 받아 주지
    # 못했을 때. 이미 보냈으면 --once-daily 가 건너뛴다
    #
    # 07:47 에서 08:47 로 미뤘다. 수집이 밀리면 예비가 수집보다 먼저 도는 일이 생긴다 —
    # 2026-10-06 에 수집이 07:41 에 돌아 그 리포트가 07:44 였으니 예비와 3분 차이였다.
    # 순서가 뒤집히면 예비가 어제 자료로 메일을 보내고 --once-daily 가 오늘 것을 막는다.
    # 늦는 것보다 낡은 것을 보내는 쪽이 나쁘다. 이 예약이 쓰이는 날은 수집이 세 번 다 빠진
    # 날이므로, 그런 날 메일이 아침을 넘기는 것은 받아들인다
    - cron: "47 23 * * *"   # 08:47 KST
  workflow_dispatch:
    inputs:
      send:
        description: "실제 발송 여부 (false면 파일만 생성)"
        default: "true"
      email_to:
        description: "테스트 수신자 (입력하면 이 주소로만 보내고 보고 상태를 기록하지 않음)"
        default: ""
      test_email:
        description: "테스트 메일 (true면 등록된 EMAIL_TO 로 메일만 보내고, 이슈·보고 상태·커밋은 건드리지 않음)"
        default: "false"
      notify_test:
        description: "공고가 없어도 알림을 한 번 보내 채널 점검 (true/false)"
        default: "false"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write   # 알림을 이슈로 연다(gia/notify/github_issue.py)
jobs:
  report:
    # 손으로 돌린 수집(소스 하나 재수집 등) 뒤에는 보내지 않는다
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 대기 중 다른 실행이 push한 최신 커밋에서 시작 (rebase 충돌 방지)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ github.event.inputs.email_to || secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://thskal17-sudo.github.io/Gyeongnam-Instructor-Announcement/
        run: |
          if [ "${{ github.event.inputs.send }}" = "false" ]; then
            python -m gia report --print
          elif [ -n "${{ github.event.inputs.email_to }}" ] || [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            # 테스트는 메일로만 보낸다. 모든 채널로 보내면 깃허브 이슈가 하나 더 열린다
            echo "테스트 발송 (메일만 · 보고 상태 기록 안 함)"
            if [ -z "$SMTP_HOST" ] || [ -z "$EMAIL_TO" ]; then
              echo "::error::SMTP_HOST 또는 EMAIL_TO 미설정 — 저장소 Secrets 에 SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD/EMAIL_FROM/EMAIL_TO 를 등록해야 발송됩니다."
              exit 1
            fi
            python -m gia report --send --no-mark --channels email
          elif [ "${{ github.event.inputs.notify_test }}" = "true" ]; then
            python -m gia report --send --notify-test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 손으로 돌리면 오늘 이미 보냈어도 다시 보낸다
            python -m gia report --send
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # 수집 직후. 오늘 첫 수집에서 새로 실패한 곳이 3곳 이상이면 두 번째 수집을 기다린다
            python -m gia report --send --once-daily --hold-if-degraded 3
          else
            # 예비 예약: 그때까지 못 보냈으면 수집 상태와 상관없이 보낸다
            # 깃허브 이슈 채널은 비밀값이 없어도 돈다. 예전처럼 --mark 로 빠지지 않는다
            python -m gia report --send --once-daily
          fi
      # 울산 저장소(ulsan-shcool-public-company)의 '오늘의 브리핑'이 이 파일을 읽어
      # 울산·경남·평생교육원 강사잇다 양식을 한 파일로 합쳐 첨부한다. 실패해도 리포트 커밋은 계속한다
      - name: 강사잇다 양식 저장 (브리핑 합본용)
        if: always() && github.event.inputs.email_to == '' && github.event.inputs.test_email != 'true'
        continue-on-error: true
        run: python -m gia gangsaitda --out reports/gangsaitda/latest.xlsx
      - name: commit report
        if: always() && github.event.inputs.email_to == '' && github.event.inputs.test_email != 'true'
        run: |
          git config user.name "gia-bot"
          git config user.email "gia-bot@users.noreply.github.com"
          git add data reports
          git commit -m "report: $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
