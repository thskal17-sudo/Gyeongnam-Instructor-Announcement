name: report
on:
  schedule:
    # 06:05 KST. 정시·반시를 피해 잡는다 — 07:30 으로 두었더니 매일 09:30~10:00 에
    # 돌았다(2026-09-24~27 실행 기록). 밀려도 07시대에는 도착하도록 당겼다
    - cron: "5 21 * * *"    # 06:05 KST
  workflow_dispatch:
    inputs:
      send:
        description: "실제 발송 여부 (false면 파일만 생성)"
        default: "true"
      email_to:
        description: "테스트 수신자 (입력하면 이 주소로만 보내고 보고 상태를 기록하지 않음)"
        default: ""
      notify_test:
        description: "공고가 없어도 알림을 한 번 보내 채널 점검 (true/false)"
        default: "false"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write   # 알림을 이슈로 연다(gia/notify/github_issue.py)
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 대기 중 다른 실행이 push한 최신 커밋에서 시작 (rebase 충돌 방지)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ github.event.inputs.email_to || secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://thskal17-sudo.github.io/Gyeongnam-Instructor-Announcement/
        run: |
          if [ "${{ github.event.inputs.send }}" = "false" ]; then
            python -m gia report --print
          elif [ -n "${{ github.event.inputs.email_to }}" ]; then
            echo "테스트 발송: ${{ github.event.inputs.email_to }} (보고 상태 기록 안 함)"
            if [ -z "$SMTP_HOST" ]; then
              echo "::error::SMTP_HOST 미설정 — 저장소 Secrets 에 SMTP_HOST/SMTP_USER/SMTP_PASSWORD 를 등록해야 발송됩니다."
              exit 1
            fi
            python -m gia report --send --no-mark
          elif [ "${{ github.event.inputs.notify_test }}" = "true" ]; then
            python -m gia report --send --notify-test
          else
            # 깃허브 이슈 채널은 비밀값이 없어도 돈다. 예전처럼 --mark 로 빠지지 않는다
            python -m gia report --send
          fi
      - name: commit report
        if: always() && github.event.inputs.email_to == ''
        run: |
          git config user.name "gia-bot"
          git config user.email "gia-bot@users.noreply.github.com"
          git add data reports
          git commit -m "report: $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
