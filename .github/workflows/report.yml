name: report
on:
  # 수집이 끝나면 바로 돈다. 예약 실행은 밀리지만 workflow_run 은 사건이라 안 밀린다.
  # 수집이 몇 시에 끝나든 그 데이터로 곧장 요약이 나간다
  workflow_run:
    workflows: [collect]
    types: [completed]
  schedule:
    # 예비. workflow_run 이 안 걸리거나 수집이 통째로 실패한 날을 위한 것이다.
    # 이미 보냈으면 --once-daily 가 막으므로 메일이 두 번 가지 않는다
    - cron: "37 21 * * *"   # 06:37 KST
  workflow_dispatch:
    inputs:
      send:
        description: "실제 발송 여부 (false면 파일만 생성)"
        default: "true"
      email_to:
        description: "테스트 수신자 (입력하면 이 주소로만 보내고 보고 상태를 기록하지 않음)"
        default: ""
      test_email:
        description: "테스트 메일 (true면 등록된 EMAIL_TO 로 메일만 보내고, 이슈·보고 상태·커밋은 건드리지 않음)"
        default: "false"
      notify_test:
        description: "공고가 없어도 알림을 한 번 보내 채널 점검 (true/false)"
        default: "false"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write   # 알림을 이슈로 연다(gia/notify/github_issue.py)
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 수집이 성공했을 때만, 그리고 기본 브랜치의 수집일 때만 따라 돈다. 개발 중
    # 기능 브랜치에서 수집을 돌려 보다가 진짜 메일이 나가면 안 된다
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    steps:
      - uses: actions/checkout@v4
        with:
          # 수집이 방금 push 한 커밋에서 시작해야 그날 데이터로 요약이 나간다.
          # workflow_run 의 head_sha 는 수집이 '시작한' 커밋이라 쓰면 안 된다
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ github.event.inputs.email_to || secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://thskal17-sudo.github.io/Gyeongnam-Instructor-Announcement/
        run: |
          if [ "${{ github.event.inputs.send }}" = "false" ]; then
            python -m gia report --print
          elif [ -n "${{ github.event.inputs.email_to }}" ] || [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            # 테스트는 메일로만 보낸다. 모든 채널로 보내면 깃허브 이슈가 하나 더 열린다
            echo "테스트 발송 (메일만 · 보고 상태 기록 안 함)"
            if [ -z "$SMTP_HOST" ] || [ -z "$EMAIL_TO" ]; then
              echo "::error::SMTP_HOST 또는 EMAIL_TO 미설정 — 저장소 Secrets 에 SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD/EMAIL_FROM/EMAIL_TO 를 등록해야 발송됩니다."
              exit 1
            fi
            python -m gia report --send --no-mark --channels email
          elif [ "${{ github.event.inputs.notify_test }}" = "true" ]; then
            python -m gia report --send --notify-test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 손으로 돌린 것은 하루 한 번 제한을 걸지 않는다. 보내라고 누른 것이다
            python -m gia report --send
          else
            # 수집 뒤 자동 실행과 예비 예약이 같은 날 겹칠 수 있다. 먼저 돈 쪽만 보낸다.
            # 깃허브 이슈 채널은 비밀값이 없어도 돈다
            python -m gia report --send --once-daily
          fi
      - name: commit report
        if: always() && github.event.inputs.email_to == '' && github.event.inputs.test_email != 'true'
        run: |
          git config user.name "gia-bot"
          git config user.email "gia-bot@users.noreply.github.com"
          git add data reports
          git commit -m "report: $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git pull --rebase origin ${{ github.event.workflow_run.head_branch || github.ref_name }}
          git push
