name: probe
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "구조를 덤프할 목록 페이지 URL (공백/줄바꿈 구분)"
        default: ""
      sources:
        description: "gia probe 로 시험 수집할 source id (공백 구분)"
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: dump structure
        if: ${{ github.event.inputs.urls != '' }}
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: python scripts/dump_structure.py
      - name: gia probe
        if: ${{ github.event.inputs.sources != '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WORKNET_API_KEY: ${{ secrets.WORKNET_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          for s in $SOURCES; do
            echo "::group::probe $s"
            python -m gia probe "$s" --detail || true
            echo "::endgroup::"
          done
