name: probe
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "구조를 덤프할 목록 페이지 URL (공백/줄바꿈 구분)"
        default: ""
      sources:
        description: "gia probe 로 시험 수집할 source id (공백 구분)"
        default: ""
      body_selector:
        description: "dump 시 이 CSS 셀렉터의 본문 전문을 출력 (예: div#bo_v_con)"
        default: ""
      grep:
        description: "dump 시 페이지 스크립트에서 이 정규식 둘레를 출력 (예: fnKfileDownload)"
        default: ""
      raw_selector:
        description: "dump 시 이 CSS 셀렉터의 원본 HTML 을 출력 (행 구조·onclick 확인용, 예: form table)"
        default: ""
      days:
        description: "probe 수집 기간(일). 비우면 settings.yaml 의 default_days(14). 게시가 뜸한 게시판 셀렉터 확인용으로 90 등"
        default: ""
      runner:
        description: "어디서 읽을지 (github: GitHub 수집 서버(미국) / korea: 한국 PC 자체 실행기 — 해외 IP 를 막는 사이트용)"
        type: choice
        options: [github, korea]
        default: github
permissions:
  contents: write   # probe 출력을 probe-results 브랜치에 올린다
jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner == 'korea' && fromJSON('["self-hosted","korea"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # 한국 PC(Windows)에서도 Git 의 bash 로 같은 명령을 돌린다
    env:
      PROBE_OUT: /tmp/probe-out.txt
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - if: github.event.inputs.runner != 'korea'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: github.event.inputs.runner != 'korea'
        run: pip install -e . requests beautifulsoup4 lxml
      # 한국 PC: 패키지는 설치 스크립트(scripts/install_korea_runner.ps1)가 미리 깔아 둔다.
      # 실행기 서비스 계정은 파이썬 폴더에 쓸 수 없어서 pip install -e . 대신 PYTHONPATH 로 gia 를 찾는다
      - if: github.event.inputs.runner == 'korea'
        run: |
          echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"
          python --version
          python -c "import gia.__main__, requests, bs4, lxml" || { echo "::error::한국 PC 에 파이썬 패키지가 없습니다. install_korea_runner.ps1 을 다시 실행하세요"; exit 1; }
      - name: dump structure
        if: ${{ github.event.inputs.urls != '' }}
        env:
          URLS: ${{ github.event.inputs.urls }}
          BODY_SELECTOR: ${{ github.event.inputs.body_selector }}
          GREP: ${{ github.event.inputs.grep }}
          RAW_SELECTOR: ${{ github.event.inputs.raw_selector }}
          # dump 도 같은 경로로 나가야 gia probe 결과와 비교가 된다 (requests 도 환경변수를 본다)
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
          NO_PROXY: github.com,api.github.com,codeload.github.com,objects.githubusercontent.com
        run: python scripts/dump_structure.py 2>&1 | tee -a "$PROBE_OUT"
      - name: gia probe
        if: ${{ github.event.inputs.sources != '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WORKNET_API_KEY: ${{ secrets.WORKNET_API_KEY }}
          # 국내 프록시(선택). 비어 있으면 러너 IP 로 그냥 나간다 — 지금까지와 같다.
          # 지자체·대학 상당수가 러너 IP 대역을 막는다(docs/SOURCE_VERIFICATION.md)
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
          # 깃허브로 가는 길은 프록시를 타지 않는다 (커밋·푸시는 러너에서 직접)
          NO_PROXY: github.com,api.github.com,codeload.github.com,objects.githubusercontent.com
          SOURCES: ${{ github.event.inputs.sources }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          {
          if [ -n "$DAYS" ]; then
            sed -i "s/^\(\s*default_days:\s*\).*/\1$DAYS/" config/settings.yaml
            grep -n "default_days" config/settings.yaml
          fi
          for s in $SOURCES; do
            echo "::group::probe $s"
            python -m gia probe "$s" --detail --limit 60 || true
            echo "::endgroup::"
          done
          } 2>&1 | tee -a "$PROBE_OUT"
      - name: publish probe output
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 러너 로그는 뒤에서 잘려 정작 필요한 표 구조가 사라진다. 전문을 브랜치에 올린다
          [ -s "$PROBE_OUT" ] || echo "(probe 출력 없음 — urls·sources 입력이 비었거나 단계가 건너뛰어졌다)" > "$PROBE_OUT"
          dest="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin probe-results 2>/dev/null; then
            # gia probe 단계가 settings.yaml 을 고쳤을 수 있다. 출력은 /tmp 에 있으니 버려도 된다
            git checkout -f -B probe-results FETCH_HEAD
          else
            git checkout --orphan probe-results
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p runs
          cp "$PROBE_OUT" "$dest"
          cp "$PROBE_OUT" latest.txt
          git add -- "$dest" latest.txt
          git commit -q -m "probe: run ${GITHUB_RUN_ID} 출력"
          git push -q origin probe-results
          echo "probe-results 브랜치에 올림: $dest"
