name: korea

# 진주·거제·산청·함양 시청 같은 곳은 해외 IP 를 막아 GitHub 수집 서버가 읽지 못한다.
# 사무실·집의 한국 PC 에 설치한 GitHub 자체 실행기(라벨 korea)가 그 사이트(sources.yaml 의
# korea_only: true)만 읽어 korea-relay 브랜치에 relay.json 으로 올린다. 수집 기록(data/)은 고치지 않는다.
# collect.yml 이 그 파일을 받아 사이트 대신 읽고, 판별·저장·메일은 평소대로 한다(gia/collectors/relay.py).
# 설치 방법: docs/KOREA_RUNNER.md
on:
  # 예약 실행(23:17·03:17 KST)은 실행기를 설치하고 korea_only 소스를 넣을 때 켠다.
  # 실행기가 없는데 예약이 돌면 작업이 하루 동안 기다리다 실패하고, 그때마다 실패 알림 메일이 간다
  #   schedule:
  #     - cron: "17 14 * * *"   # 23:17 KST (전날) — collect.yml(23:47·02:47·04:17)보다 먼저
  #     - cron: "17 18 * * *"   # 03:17 KST
  workflow_dispatch:
    inputs:
      sources:
        description: "쉼표로 구분한 source id (비우면 korea_only 전부)"
        default: ""

permissions:
  contents: write   # korea-relay 브랜치에 올린다

# PC 가 꺼져 있으면 작업이 실행기를 기다리며 쌓인다. 새 작업이 오면 기다리던 것은 취소한다.
# collect.yml 과 다른 그룹이다 — 같은 그룹이면 PC 가 꺼진 날 GitHub 수집까지 묶여 기다린다
concurrency:
  group: korea-collect
  cancel-in-progress: true

jobs:
  korea:
    runs-on: [self-hosted, korea]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      # 패키지는 설치 스크립트가 미리 깔아 둔다. 실행기 서비스 계정은 파이썬 폴더에 쓸 수 없어서
      # pip install -e . 대신 PYTHONPATH 로 gia 를 찾는다
      - name: 파이썬 확인
        run: |
          echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"
          python --version
          PYTHONPATH=$PWD python -c "import gia.__main__" || { echo "::error::한국 PC 에 파이썬 패키지가 없습니다. scripts/install_korea_runner.ps1 을 다시 실행하세요"; exit 1; }

      - name: 지난 기록 가져오기
        run: |
          if git fetch -q --depth=1 origin korea-relay 2>/dev/null; then
            git show FETCH_HEAD:relay.json > "$RUNNER_TEMP/prev-relay.json" || true
          fi

      - name: 해외 차단 사이트 읽기
        env:
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          ARGS=()
          [ -s "$RUNNER_TEMP/prev-relay.json" ] && ARGS+=(--prev "$RUNNER_TEMP/prev-relay.json")
          [ -n "$SOURCES" ] && ARGS+=(--sources "$SOURCES")
          python -m gia korea-export --out "$RUNNER_TEMP/relay.json" "${ARGS[@]}"

      # 기록은 한 장(relay.json)만 둔다. 지난 것은 남길 까닭이 없어 브랜치를 매번 새 커밋 하나로 바꾼다
      - name: korea-relay 브랜치에 올리기
        run: |
          git config user.name "gia-korea"
          git config user.email "gia-bot@users.noreply.github.com"
          git checkout -q --orphan korea-relay-new
          git rm -rq --cached .
          cp "$RUNNER_TEMP/relay.json" relay.json
          git add relay.json
          git commit -q -m "korea: 해외 차단 사이트 기록"
          git push -q -f origin HEAD:korea-relay
          echo "korea-relay 브랜치에 올림"
