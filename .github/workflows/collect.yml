name: collect-announcements

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/collect.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # xlsx 는 매번 바이너리가 달라지므로 텍스트 데이터가 바뀐 경우에만 커밋한다.
          if git diff --quiet -- data/announcements.json data/announcements.csv data/announcements.md data/institutions.json; then
            echo "no data changes"; exit 0
          fi
          git add data/
          git commit -m "data: weekly announcement collection $(date -u +%F)"
          git push
