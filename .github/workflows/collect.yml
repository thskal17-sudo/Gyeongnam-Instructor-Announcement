name: collect
on:
  schedule:
    # GitHub 의 예약 실행은 제시간을 보장하지 않는다. 05:10 으로 두었더니 매일 08:40~09:20 에
    # 돌았다(2026-09-23~29 실행 기록, 3시간 반~4시간 지연). 밀려도 아침 전에 끝나도록 새벽으로
    # 당기고, 한 번 통째로 빠지는 날에 대비해 여러 번 잡는다. 뒤의 수집은 새 공고만 더 모으고,
    # 리포트는 --once-daily 로 하루 한 번만 나간다(report.yml)
    #
    # 세 번으로 늘린 이유: GitHub 은 많이 밀린 예약을 실행하지 않고 버린다. 2026-10-06 에
    # 01:17 예약이 실행 기록조차 없이 빠졌고, 남은 04:17 하나가 07:41 에 돌아 메일이
    # 07:44 였다(그 전날은 04:43). 둘 중 하나가 빠지면 남는 것이 하나뿐이어서 여유가 없다
    # 첫 예약을 전날 밤으로 당긴다. 2026-10-13 에 지연이 6시간 44분까지 늘어 01:17 예약이
    # 08:01 에 돌았고 메일이 08:05 — 아침 기준선을 넘겼다. 23:47 이면 같은 지연에도 06:31 이다
    #
    # 전날로 당겨도 메일이 두 번 가지 않는다. --once-daily 가 KST '날짜'로 세기 때문이다
    # (Store.reported_on). 23:47 수집이 제때 돌면 그 리포트는 23:51 쯤인데, 그날 아침에 이미
    # 보냈으므로 같은 날짜로 걸려 건너뛴다 — 자료만 모아 두고 다음 날 아침 메일이 그것을 쓴다.
    # 밀려서 다음 날 새벽에 돌면 그때는 새 날짜라 그 리포트가 아침 메일을 보낸다. 어느 쪽이든
    # 하루 한 번이다. 그래서 자정에서 몇 분 거리는 피한다 — 23:59 로 두면 리포트가 00:02 에
    # 돌아 날짜가 넘어가고, 한밤중에 메일이 나간다
    - cron: "47 14 * * *"   # 23:47 KST (전날)
    - cron: "47 17 * * *"   # 02:47 KST (예비)
    - cron: "17 19 * * *"   # 04:17 KST (예비)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "백필 일수 (0이면 기본 14일)"
        default: "0"
      sources:
        description: "쉼표로 구분한 source id (비우면 전체)"
        default: ""
      refetch:
        description: "이미 알던 URL도 상세를 다시 파싱 (파서 수정 후 보정용, true/false)"
        default: "false"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 대기 중 다른 실행이 push한 최신 커밋에서 시작 (rebase 충돌 방지)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # 해외 IP 를 막는 사이트(korea_only)는 한국 PC 가 읽어 korea-relay 브랜치에 올려 둔다(korea.yml).
      # 그 기록을 받아 두면 collect 가 사이트 대신 읽는다. 없으면 그 소스들만 '건너뜀'이 된다
      - name: 한국 PC 수집 기록 가져오기
        run: |
          if git fetch -q --depth=1 origin korea-relay 2>/dev/null && git show FETCH_HEAD:relay.json > "$RUNNER_TEMP/korea-relay.json"; then
            python -c "import json,sys; r=json.load(open(sys.argv[1],encoding='utf-8')); print('한국 PC 기록', r['generated_at'], '· 소스', len(r['sources']))" "$RUNNER_TEMP/korea-relay.json"
          else
            echo "한국 PC 기록 없음 (korea-relay 브랜치 없음)"
          fi
      - name: collect
        env:
          GIA_KOREA_RELAY: ${{ runner.temp }}/korea-relay.json
          # 국내 중계 서버(울산판과 같은 tinyproxy). 있으면 한국 사이트(.kr)는 이 중계로 읽는다. 없으면 바로 접속
          KR_PROXY_URL: ${{ secrets.KR_PROXY_URL }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WORKNET_API_KEY: ${{ secrets.WORKNET_API_KEY }}
          # 국내 프록시(선택). 비어 있으면 러너 IP 로 그냥 나간다 — 지금까지와 같다.
          # 지자체·대학 상당수가 러너 IP 대역을 막는다(docs/SOURCE_VERIFICATION.md)
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
          # 깃허브로 가는 길은 프록시를 타지 않는다 (커밋·푸시는 러너에서 직접)
          NO_PROXY: github.com,api.github.com,codeload.github.com,objects.githubusercontent.com
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill_days }}" != "" ] && [ "${{ github.event.inputs.backfill_days }}" != "0" ]; then ARGS="$ARGS --backfill-days ${{ github.event.inputs.backfill_days }}"; fi
          if [ "${{ github.event.inputs.sources }}" != "" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          if [ "${{ github.event.inputs.refetch }}" = "true" ]; then ARGS="$ARGS --refetch"; fi
          python -m gia collect $ARGS
      - name: commit data
        run: |
          git config user.name "gia-bot"
          git config user.email "gia-bot@users.noreply.github.com"
          git add data
          git commit -m "data: collect $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
