# 수집원 레지스트리 (단일 진실 원천)
# - 스키마: docs/DESIGN.md 13.1 참조
# - verified: false 인 항목은 구현 단계에서 URL·게시판 경로·셀렉터를 실측 확인한 뒤 true로 바꾼다.
#   (이 파일의 homepage 값은 공개적으로 알려진 도메인을 적은 것이며, 이 설계 시점에 접속 검증은 하지 못했다.)
# - board_path 는 채용/공고 게시판의 상대 경로. TODO 는 구현 시 확인.
# - adapter 는 최소 항목만 적었다. 셀렉터 등 세부 값은 probe 명령으로 확인하며 채운다.

defaults:
  enabled: true
  verified: false
  tos_checked: false
  schedule: daily
  region_hint: [경남, 경상남도]
  adapter:
    paging: { max_pages: 2 }

# ---------------------------------------------------------------------------
# Tier 1. 통합 채용 포털 (API 우선)  — Phase 1
# ---------------------------------------------------------------------------
sources:
  - id: gojobs
    name: 나라일터·공공기관 채용정보 (인사혁신처)
    org_type: portal
    tier: 1
    schedule: daily_light
    homepage: https://www.gojobs.go.kr
    adapter:
      type: api_json
      endpoint: https://apis.data.go.kr/1051000/recruitment/list
      format: json
      params:
        serviceKey: "${DATA_GO_KR_KEY}"
        resultType: json
      paging: { page_param: pageNo, size_param: numOfRows, size: 100, max_pages: 5 }
      items_path: result
      field_map:
        title: recrutPbancTtl
        org_name: instNm
        posted_at: pbancBgngYmd
        deadline: pbancEndYmd
        region: workRgnNmLst
        url: srcUrl
      date_formats: ["%Y%m%d"]
      keywords: [강사, 교강사, 시간강사, 외래, 훈련교사, 지도자, 지도사, 튜터, 코치, 멘토]
      region_filter: "@gyeongnam"
      detail: { fetch: false }
    notes: >-
      공공데이터포털 '인사혁신처_공공기관 채용정보' API 기준으로 작성. 엔드포인트·필드명(recrutPbancTtl,
      instNm, pbancBgngYmd, pbancEndYmd, workRgnNmLst, srcUrl)은 `gia probe gojobs`로 실측 후 verified: true.
      환경변수 DATA_GO_KR_KEY 필요.

  - id: alio
    name: 잡알리오 (기획재정부, 공공기관 채용)
    org_type: portal
    tier: 1
    schedule: daily_light
    homepage: https://job.alio.go.kr
    adapter:
      type: api_json
      endpoint: TODO          # 공공데이터포털 '기획재정부_공공기관 채용정보' 엔드포인트 확인
      format: json
      params: { serviceKey: "${DATA_GO_KR_KEY}" }
      paging: { page_param: pageNo, size_param: numOfRows, size: 100, max_pages: 5 }
      items_path: TODO
      field_map: { title: TODO, org_name: TODO, posted_at: TODO, deadline: TODO, region: TODO, url: TODO }
      keywords: [강사, 교강사, 시간강사, 외래교수, 훈련교사]
      region_filter: "@gyeongnam"
      detail: { fetch: false }
    notes: gojobs(인사혁신처 API)가 공공기관 채용을 이미 포함하면 중복이므로 검증 후 enabled 여부 결정

  - id: cleaneye
    name: 클린아이 잡플러스 (행안부, 지방공기업·출자출연기관)
    org_type: portal
    tier: 1
    schedule: daily_light
    homepage: https://job.cleaneye.go.kr
    adapter:
      type: html_list
      list_url: TODO          # 지역=경남 검색 결과 URL ({page} 자리표시자 사용 가능)
      row_selector: TODO
      title_selector: a
      date_selector: TODO
      org_selector: TODO
      keywords: [강사, 교강사, 시간강사, 지도자, 지도사]
      detail: { fetch: true, body_selector: TODO }
    notes: 경남 출자출연기관 채용 대부분 커버. API 유무 확인 필요

  - id: work24
    name: 고용24 / 워크넷 (고용노동부)
    org_type: portal
    tier: 1
    schedule: daily_light
    homepage: https://www.work24.go.kr
    adapter:
      type: api_json
      endpoint: https://openapi.work.go.kr/opi/opi/opia/wantedApi.do
      format: xml
      params:
        authKey: "${WORKNET_API_KEY}"
        callTp: L
        returnType: XML
        region: "48000"       # 경남 지역코드 (확인 필요)
        keyword: 강사
      paging: { page_param: startPage, size_param: display, size: 100, max_pages: 5 }
      items_path: wantedRoot.wanted
      field_map:
        title: title
        org_name: company
        posted_at: regDt
        deadline: closeDate
        region: region
        url: wantedInfoUrl
      date_formats: ["%y-%m-%d", "%Y-%m-%d"]
      detail: { fetch: false }
    notes: >-
      워크넷 채용정보 Open API(XML) 기준. 2024년 이후 고용24로 이관되어 엔드포인트가 바뀌었을 수 있음.
      probe로 검증. 환경변수 WORKNET_API_KEY 필요. 민간 학원·훈련기관 강사 공고의 주 유입원.

  - id: g2b
    name: 나라장터 (조달청, 용역 입찰공고)
    org_type: portal
    tier: 1
    enabled: false            # 강사 개인이 아닌 교육 용역 업체 대상. 필요 시 활성화
    homepage: https://www.g2b.go.kr
    adapter:
      type: api_json
      endpoint: https://apis.data.go.kr/1230000/ad/BidPublicInfoService/getBidPblancListInfoServcPPSSrch
      format: json
      params:
        serviceKey: "${DATA_GO_KR_KEY}"
        type: json
        inqryDiv: "1"
        inqryBgnDt: "{since}0000"
        inqryEndDt: "{today}2359"
        bidNtceNm: 강사
      paging: { page_param: pageNo, size_param: numOfRows, size: 100, max_pages: 3 }
      items_path: response.body.items
      field_map:
        title: bidNtceNm
        org_name: dminsttNm
        posted_at: bidNtceDt
        deadline: bidClseDt
        region: dminsttNm
        url: bidNtceDtlUrl
      date_formats: ["%Y-%m-%d %H:%M:%S", "%Y%m%d%H%M"]
      region_filter: "@gyeongnam"
      detail: { fetch: false }
    notes: 수요기관명으로 경남 필터. 공공데이터포털 '조달청_나라장터 입찰공고정보' 기준

# ---------------------------------------------------------------------------
# Tier 2. 경남도·시군·교육청  — Phase 2
# ---------------------------------------------------------------------------
  - id: gyeongnam_go
    name: 경상남도청
    org_type: local_gov
    tier: 2
    homepage: https://www.gyeongnam.go.kr
    adapter:
      type: html_list
      list_url: TODO
      candidate_list_url: https://www.gyeongnam.go.kr/board/list.gyeong?boardId=BBS_0000377&menuCd=DOM_000000108002002000&startPage={page}
    notes: >-
      경남채용정보 게시판 후보. GitHub 러너에서 '페이지를 표시할 수 없습니다'(1.4KB 차단 페이지) 또는 연결 시간초과(2026-09-21). 2026-09-22 브라우저형 헤더·Referer·재시도 적용 후 3개 러너(westus3×2, centralus)에서 재시도 → 동일 실패. GitHub 호스티드 러너 IP 대역을 일관되게 차단하는 것으로 판단, 국내 IP(자체 호스팅 러너·프록시) 또는 로컬 `python -m gia probe` 필요. 도 본청 공무직 채용은 saramin 위탁(gyeongnam.saramin.co.kr)

  - id: gne
    name: 경상남도교육청 구인구직포털
    org_type: edu_office
    tier: 2
    homepage: https://www.gne.go.kr/works/index.do
    verified: true
    adapter:
      type: html_list
      list_url: https://www.gne.go.kr/works/user/recruitment/BD_recruitmentList.do?pageIndex={page}
      row_selector: table.frmbd-list-tbl tr
      title_selector: td.tl span.tit
      link_selector: td.tl a
      link_attr: onclick
      link_regex: "openDetail\\('(\\d+)'\\)"
      link_url_template: "https://www.gne.go.kr/works/user/recruitment/BD_recruitmentDetail.do?regSn={1}"
      date_selector: td:nth-child(3) span:nth-of-type(2)
      org_selector: td:nth-child(2) span:nth-of-type(2)
      keywords: [강사, 교강사, 지도사, 지도자, 코치, 방과후, 늘봄, 돌봄]
      paging: { max_pages: 1 }
      detail:
        fetch: true
        body_selector: div.prgr-bd-view
    notes: >-
      도내 학교·교육지원청의 강사·방과후·돌봄 공고가 모이는 통합 포털(2026-09-21 GitHub 러너에서 검증).
      목록 3열은 접수기간이라 게시일 대신 접수 시작일이 잡힘. 첨부는 javascript 다운로드라 미추출.
      pageIndex 파라미터가 무시되어(POST 페이징) 1페이지(10건)만 수집.
      구 채용·모집공고 게시판(board/list.gne?boardId=BBS_0000448)은 404.

  - id: gne_district
    name: 경남 교육지원청 (18개)
    org_type: edu_office
    tier: 2
    enabled: false
    homepage: TODO
    adapter: { type: html_list, list_url: TODO }
    notes: gne 통합 게시판이 학교 공고를 포함하면 불필요. 아니면 시군별로 18개 항목으로 분리 등록

