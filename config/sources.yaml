# 수집원 레지스트리 (단일 진실 원천)
# - 스키마: docs/DESIGN.md 13.1 참조
# - verified: false 인 항목은 구현 단계에서 URL·게시판 경로·셀렉터를 실측 확인한 뒤 true로 바꾼다.
#   (이 파일의 homepage 값은 공개적으로 알려진 도메인을 적은 것이며, 이 설계 시점에 접속 검증은 하지 못했다.)
# - board_path 는 채용/공고 게시판의 상대 경로. TODO 는 구현 시 확인.
# - adapter 는 최소 항목만 적었다. 셀렉터 등 세부 값은 probe 명령으로 확인하며 채운다.

defaults:
  enabled: true
  verified: false
  tos_checked: false
  schedule: daily
  region_hint: [경남, 경상남도]
  adapter:
    paging: { max_pages: 2 }

# ---------------------------------------------------------------------------
# Tier 1. 통합 채용 포털 (API 우선)  — Phase 1
# ---------------------------------------------------------------------------
# 새올(eminwon) 행정 고시공고 공통 설정. 시군 홈페이지가 GitHub 러너 IP 를 막아도 새올 서버는 열리는 곳이 많다.
# 행: 번호 / 공고번호 / 제목 / 담당부서 / 등록일 (/ 조회수). 상세는 onclick="searchDetail('관리번호')" 인데
# 군마다 onclick 위치가 다르다 — 하동은 칸 안의 <a>, 의령은 <td> 자체. 둘 다 받도록 [onclick] 로 찾는다.
# 의령은 긴 제목을 목록에서 '...' 로 자른다(상세에는 전체 제목).
# 채용 분류 코드(05)는 시군마다 달라(하동 05=채용, 의령 05=0건) 전체 분류를 받고 제목으로 거른다.
x-eminwon: &eminwon
  row_selector: "tr:has(> td[onclick*='searchDetail']), tr:has(> td > a[onclick*='searchDetail'])"
  title_selector: "td:nth-of-type(3)"
  link_selector: "[onclick*='searchDetail']"
  link_attr: onclick
  link_regex: "searchDetail\\('(\\d+)'\\)"
  date_selector: "td:nth-of-type(5)"
  keywords: [채용, 모집, 강사, 기간제, 위촉, 선발, 인력풀, 지도사, 코치, 튜터]
  paging: { max_pages: 4 }
  # 새올 서버는 가끔 수십 초씩 응답을 멈춘다(고성 robots.txt 25초 무응답·목록은 같은 때 정상,
  # 2026-10-05). 기본 20초·즉시 재시도로는 멈춘 사이에 세 번을 다 써서 실패했다
  timeout_sec: 40
  retries: 3
  detail:
    fetch: true
    body_selector: form
    content_selector: "td[colspan='4'][style*='word-break']"
    title_label: 제목          # 목록이 '...' 로 자른 제목을 상세의 '제목' 칸으로 되찾는다
    # 첨부는 javascript:goDownLoad('원래이름','저장이름','경로') → FileDown.jsp (2026-10-03 확인)
    attachment_selector: "a[href*='goDownLoad']"
    attachment_regex: "goDownLoad\\('([^']*)',\\s*'([^']*)',\\s*'([^']*)'\\)"
    attachment_url_template: "/emwp/jsp/ofr/FileDown.jsp?user_file_nm={1}&sys_file_nm={2}&file_path={3}"

sources:
  - id: gojobs
    name: 공공기관 채용정보 (재정경제부·잡알리오)
    org_type: portal
    tier: 1
    schedule: daily_light
    homepage: https://www.gojobs.go.kr
    adapter:
      type: api_json
      endpoint: https://apis.data.go.kr/1051000/recruitment/list
      format: json
      params:
        serviceKey: "${DATA_GO_KR_KEY}"
        resultType: json
        # 전국 모든 공공기관 공고를 주므로 요청 단계에서 줄인다. 거르지 않으면 앞 500건 안에
        # 경남 강사 공고가 하나도 없어 0건이 됐다(2026-09-30 probe: 키워드 499·지역 1 탈락)
        ongoingYn: "Y"        # 진행 중인 공고만
        workRgnLst: R3022     # 근무지 경남 (코드정의서 R3000 계열: R3016 울산, R3014 부산)
      paging: { page_param: pageNo, size_param: numOfRows, size: 100, max_pages: 5 }
      items_path: result
      field_map:
        title: recrutPbancTtl
        org_name: instNm
        posted_at: pbancBgngYmd
        deadline: pbancEndYmd
        region: workRgnNmLst
        url: srcUrl
      date_formats: ["%Y%m%d"]
      keywords: [강사, 교강사, 시간강사, 외래, 훈련교사, 지도자, 지도사, 튜터, 코치, 멘토]
      region_filter: "@gyeongnam"
      detail: { fetch: false }
    notes: >-
      id 는 예전 이름(gojobs)을 그대로 쓰지만, 엔드포인트(1051000)는 공공데이터포털 '재정경제부_공공기관
      채용정보 조회서비스'(잡알리오, 데이터셋 15125273)다. 2026-09-29 활용 승인 뒤부터 200 으로 응답한다.
      필드명은 2026-09-30 probe 로 실측했다. 요청 변수: ongoingYn(Y/N), workRgnLst(지역 코드, 쉼표 구분),
      recrutPbancTtl(제목 부분일치), pbancBgngYmd/pbancEndYmd(공고 시작일 범위, YYYY-MM-DD).
      환경변수 DATA_GO_KR_KEY 필요.

