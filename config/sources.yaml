    adapter:
      type: html_list
      list_url: https://longlife.gnu.ac.kr/board.jsp?sID=0401
      row_selector: table.base tbody tr
      title_selector: td.left a
      link_selector: td.left a
      link_attr: href
      link_regex: 'toPage\("(\d+)"\)'
      link_url_template: https://longlife.gnu.ac.kr/board.jsp?sID=0401&btype=view&bcode=notice&no={1}
      date_selector: td:nth-child(5)
      org_selector: td:nth-child(4)
