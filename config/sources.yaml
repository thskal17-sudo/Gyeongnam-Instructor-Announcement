    notes: >-
      공지사항 게시판(2026-09-22 GitHub 러너에서 구조 검증). 그러나 robots.txt 가 'User-agent: * Disallow: /' 라 gia(respect_robots) 수집 불가 → 비활성.
      사이트 운영자 허락을 받거나 정책을 바꾸기 전까지 수동 확인 대상. 링크가 javascript:toPage("번호") 라 홈 화면의 상세 URL 형식으로 조립.
      매 학기 '[강사 공지] 강좌 개설 신청 안내'가 올라옴(강사가 강좌를 제안하는 방식). 페이징 파라미터 미확인이라 1페이지(10건)만.
